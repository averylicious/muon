name: Android APKs

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      diagnostic_debug:
        # Temporary device diagnosis only: see docs/ci.md. Never publishes.
        description: Diagnostic build (separate debuggable APK; branches other than main only, never published)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  build:
    name: Build, test and sign
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      channel: ${{ steps.version.outputs.channel }}
      version: ${{ steps.version.outputs.version }}
      diagnostic: ${{ steps.diagnostic.outputs.diagnostic }}
    env:
      MUON_VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check CI scope and publication safeguards
        run: python3 -m unittest discover -s tools -p 'test_ci*.py' && python3 -m unittest discover -s tools -p 'test_release.py'

      - name: Check Stable tag ancestry before signing
        run: python3 tools/check_release_policy.py

      - name: Select CI scope and check documentation
        id: scope
        env:
          # Read-only release metadata; signing secrets remain in the later build step.
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci_scope.py

      # Before the SDK and signing keys: an invalid or unauthorized request fails the run here.
      - name: Select diagnostic build mode
        if: steps.scope.outputs.build_apks == 'true'
        id: diagnostic
        env:
          MUON_DIAGNOSTIC_REQUEST: ${{ inputs.diagnostic_debug }}
        run: python3 tools/diagnostic_mode.py

      - name: Select version and publication channel
        if: steps.scope.outputs.build_apks == 'true'
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DIAGNOSTIC: ${{ steps.diagnostic.outputs.diagnostic }}
        run: |
          set -euo pipefail
          version=0.1.0
          channel=none
          if [[ "$REF_TYPE" == tag ]]; then
            [[ "$REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Stable tags must be vMAJOR.MINOR.PATCH'; exit 1; }
            version="${REF_NAME#v}"
            channel=stable
          elif [[ "$REF_NAME" == main ]]; then
            channel=canary
          fi
          # A diagnostic build never publishes, whatever the ref.
          [[ "$DIAGNOSTIC" == false ]] || channel=none
          echo "MUON_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The action verifies archives only when it downloads, not when the runner cache wins.
      - name: Isolate preinstalled Temurin cache before verification
        if: steps.scope.outputs.build_apks == 'true'
        env:
          MUON_TOOL_CACHE_ROOT: ${{ runner.tool_cache }}
          MUON_JDK_QUARANTINE: ${{ runner.temp }}/muon-preinstalled-temurin
        run: python3 -I tools/isolate_java_toolcache.py "$MUON_TOOL_CACHE_ROOT" "$MUON_JDK_QUARANTINE"

      - name: Set up Java 17
        if: steps.scope.outputs.build_apks == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          verify-signature: true

      - name: Verify wrapper before Gradle cache restore
        if: steps.scope.outputs.build_apks == 'true'
        run: python3 tools/verify_gradle_wrapper.py

      - name: Set up Gradle and validate wrapper
        if: steps.scope.outputs.build_apks == 'true'
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          # Avoid a post-action fallback Gradle execution if our guard fails.
          cache-cleanup: never

      - name: Isolate restored Gradle distributions before execution
        if: steps.scope.outputs.build_apks == 'true'
        run: python3 -I tools/isolate_gradle_distribution.py "$GRADLE_USER_HOME" "$HOME" "$RUNNER_TEMP"

      - name: Install Android SDK packages
        if: steps.scope.outputs.build_apks == 'true'
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"'

      # Separate default-key helper, built before any Muon signing material is restored.
      - name: Build disposable media-entry QA helper
        if: steps.diagnostic.outputs.diagnostic == 'true'
        env:
          MUON_DIAGNOSTIC_REQUEST: ${{ inputs.diagnostic_debug }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain :mediaentryprobe:assembleDebug :mediaentryprobe:lintDebug
          python3 tools/verify_entryprobe.py "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" mediaentryprobe/build/outputs/apk/debug/mediaentryprobe-debug.apk
          mkdir -p artifacts/entryprobe
          cp mediaentryprobe/build/outputs/apk/debug/mediaentryprobe-debug.apk artifacts/entryprobe/
          (cd artifacts/entryprobe && sha256sum mediaentryprobe-debug.apk > SHA256SUMS)
          printf 'Commit: %s\nRun: %s\nVersion: qa.%s\nMode: disposable foreign-UID QA probe; default ephemeral debug key; never published\n' "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" > artifacts/entryprobe/BUILD.txt

      - name: Upload media-entry QA helper
        if: steps.diagnostic.outputs.diagnostic == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: media-entry-probe-${{ github.sha }}
          path: artifacts/entryprobe/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Restore signing keys
        if: steps.scope.outputs.build_apks == 'true'
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.MUON_DEBUG_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.MUON_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_PASSWORD: ${{ secrets.MUON_RELEASE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DEBUG_KEYSTORE_BASE64" || { echo 'Missing debug signing secret'; exit 1; }
          test -n "$RELEASE_KEYSTORE_BASE64" || { echo 'Missing release signing secret'; exit 1; }
          test -n "$RELEASE_PASSWORD" || { echo 'Missing release password secret'; exit 1; }
          umask 077
          mkdir -p "$RUNNER_TEMP/muon-signing"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/muon-signing/debug.keystore"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/muon-signing/release.p12"
          echo "MUON_DEBUG_KEYSTORE=$RUNNER_TEMP/muon-signing/debug.keystore" >> "$GITHUB_ENV"
          echo "MUON_RELEASE_KEYSTORE=$RUNNER_TEMP/muon-signing/release.p12" >> "$GITHUB_ENV"

      - name: Build APKs and run checks
        if: steps.scope.outputs.build_apks == 'true'
        env:
          MUON_RELEASE_PASSWORD: ${{ secrets.MUON_RELEASE_PASSWORD }}
        run: >-
          ./gradlew --no-daemon --console=plain
          :app:assembleDebug :app:assembleRelease
          :app:testDebugUnitTest :app:testReleaseUnitTest
          :app:lintDebug :app:lintRelease

      - name: Verify APK signatures and prepare artifacts
        if: steps.scope.outputs.build_apks == 'true'
        env:
          MUON_DIAGNOSTIC_REQUEST: ${{ inputs.diagnostic_debug }}
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          "$apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          python3 tools/verify-apks.py "$ANDROID_HOME/build-tools/37.0.0"
          mkdir -p artifacts/debug artifacts/release
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/debug/
          cp app/build/outputs/apk/release/app-release.apk artifacts/release/
          (cd artifacts/debug && sha256sum app-debug.apk > SHA256SUMS)
          (cd artifacts/release && sha256sum app-release.apk > SHA256SUMS)
          if [[ "$MUON_DIAGNOSTIC_DEBUG" == true ]]; then
            printf 'Commit: %s\nRun: %s\nVersion: %s-canary.%s-diagnostic\nMode: diagnostic (debuggable; temporary testing only, never published)\n' "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$MUON_VERSION_NAME" "$GITHUB_RUN_NUMBER" > artifacts/debug/BUILD.txt
          else
            printf 'Commit: %s\nRun: %s\nVersion: %s-canary.%s\n' "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$MUON_VERSION_NAME" "$GITHUB_RUN_NUMBER" > artifacts/debug/BUILD.txt
          fi
          printf 'Commit: %s\nRun: %s\nVersion: %s\n' "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$MUON_VERSION_NAME" > artifacts/release/BUILD.txt

      - name: Upload debug APK
        if: steps.scope.outputs.build_apks == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-${{ steps.diagnostic.outputs.diagnostic == 'true' && 'diagnostic' || 'debug' }}-${{ github.sha }}
          path: artifacts/debug/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload release APK
        if: steps.scope.outputs.build_apks == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-release-${{ github.sha }}
          path: artifacts/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload test, lint and release mapping reports
        if: always() && steps.scope.outputs.build_apks == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/mapping/release/
          if-no-files-found: warn
          retention-days: 14

      - name: Remove signing files
        if: always() && steps.scope.outputs.build_apks == 'true'
        run: rm -rf "$RUNNER_TEMP/muon-signing"

  publish:
    name: Publish private release
    needs: build
    # The diagnostic check is separate from the channel so a diagnostic build can never publish.
    if: needs.build.outputs.diagnostic == 'false' && (needs.build.outputs.channel == 'canary' || needs.build.outputs.channel == 'stable')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    # Serialize publications. Completed releases are never overwritten on reruns.
    concurrency:
      group: muon-release-publication
      cancel-in-progress: false
    steps:
      - name: Check out publication script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Recheck Stable tag ancestry before publication
        run: python3 tools/check_release_policy.py

      - name: Download verified APK artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: app-${{ needs.build.outputs.channel == 'canary' && 'debug' || 'release' }}-${{ github.sha }}
          path: release-input

      - name: Publish APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.build.outputs.channel }}
          VERSION: ${{ needs.build.outputs.version }}
        run: python3 tools/publish-release.py
