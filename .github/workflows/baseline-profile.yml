name: Baseline Profile tools

# Builds the two APKs that record Muon's Baseline Profile on a phone (#83): "Muon Benchmark", the app's
# benchmark build in its own package, and the test APK that drives it. Nothing here
# is published or signed with the release key. See docs/baseline-profile.md. Runs by hand, or when the
# generator itself changes.
on:
  workflow_dispatch:
    inputs:
      measurement:
        description: Build minified tools for matched startup measurement instead of profile recording
        type: boolean
        default: false
  push:
    paths: ['baselineprofile/**', 'app/src/benchmark/**', 'app/build.gradle.kts', '.github/workflows/baseline-profile.yml', 'tools/verify_gradle_wrapper.py', 'tools/test_ci_wrapper.py', 'tools/isolate_java_toolcache.py', 'tools/isolate_gradle_distribution.py', 'tools/test_ci_distribution.py', 'tools/verify_benchmark_gate_tests.py', 'tools/test_ci_benchmark_gate.py']

permissions:
  contents: read

jobs:
  build:
    name: Build benchmark and generator APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Push builds stay recording-mode; only a manual dispatch can request the minified target.
      MUON_BENCHMARK_MINIFIED: ${{ github.event_name == 'workflow_dispatch' && inputs.measurement && 'true' || 'false' }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # The action verifies archives only when it downloads, not when the runner cache wins.
      - name: Isolate preinstalled Temurin cache before verification
        env:
          MUON_TOOL_CACHE_ROOT: ${{ runner.tool_cache }}
          MUON_JDK_QUARANTINE: ${{ runner.temp }}/muon-preinstalled-temurin
        run: python3 -I tools/isolate_java_toolcache.py "$MUON_TOOL_CACHE_ROOT" "$MUON_JDK_QUARANTINE"

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          verify-signature: true

      - name: Verify wrapper before Gradle cache restore
        run: python3 tools/verify_gradle_wrapper.py

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          # Avoid a post-action fallback Gradle execution if our guard fails.
          cache-cleanup: never

      - name: Isolate restored Gradle distributions before execution
        run: python3 -I tools/isolate_gradle_distribution.py "$GRADLE_USER_HOME" "$HOME" "$RUNNER_TEMP"

      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"'

      # These two existing tests assert the compiled benchmark gate and exercise its default.
      # Coverage belongs to this optional workflow's runs; selector changes do not trigger it.
      - name: Test benchmark storage gate before signing
        run: >-
          ./gradlew --no-daemon --console=plain :app:testBenchmarkUnitTest
          --tests 'dev.avery.muon.PartitionStorePreparationTest.disabledSelectedStartupRefusesPartitionBeforeAnyProviderOrLegacyNativeFallback'
          --tests 'dev.avery.muon.PartitionStorePreparationTest.compiledDefaultSelectorHonorsChannelWithoutLegacyNativeFallback'

      # Gradle's filters form a union: one renamed method must not leave a green one-test run.
      - name: Verify both benchmark gate tests passed
        run: python3 tools/verify_benchmark_gate_tests.py app/build/test-results/testBenchmarkUnitTest

      - name: Restore the debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.MUON_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$DEBUG_KEYSTORE_BASE64" || { echo 'Missing debug signing secret'; exit 1; }
          umask 077
          mkdir -p "$RUNNER_TEMP/muon-signing"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/muon-signing/debug.keystore"
          echo "MUON_DEBUG_KEYSTORE=$RUNNER_TEMP/muon-signing/debug.keystore" >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew --no-daemon --console=plain :app:assembleBenchmark :baselineprofile:assembleBenchmark

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/benchmark/app-benchmark.apk out/
          cp baselineprofile/build/outputs/apk/benchmark/baselineprofile-benchmark.apk out/
          (cd out && sha256sum *.apk > SHA256SUMS)
          printf 'Commit: %s\nRun: %s\nBenchmark minified: %s\n' "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$MUON_BENCHMARK_MINIFIED" > out/BUILD.txt

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: baseline-profile-tools-${{ github.sha }}
          path: out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload benchmark gate test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-gate-reports-${{ github.sha }}
          path: |
            app/build/test-results/testBenchmarkUnitTest/
            app/build/reports/tests/testBenchmarkUnitTest/
          if-no-files-found: warn
          retention-days: 7

      - name: Remove signing files
        if: always()
        run: rm -rf "$RUNNER_TEMP/muon-signing"
