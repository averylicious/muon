<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1340" height="1110" viewBox="0 0 1340 1110" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Muon “On this device” (saved copies) proposal: list, row menu, delete confirmation</title>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#3D5A80"/><stop offset=".7" stop-color="#98C1D9"/><stop offset="1" stop-color="#E0FBFC"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#6D2E46"/><stop offset=".55" stop-color="#A26769"/><stop offset="1" stop-color="#D5B9B2"/></linearGradient>
    <radialGradient id="g3" cx=".5" cy="1.2" r=".9"><stop offset=".6" stop-color="#95D5B2"/><stop offset=".61" stop-color="#2D6A4F"/></radialGradient>
    <pattern id="g4" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="11" height="11" fill="#22223B"/><rect width="5.5" height="11" fill="#4A4E69"/></pattern>
    <clipPath id="phoneClip"><rect width="380" height="820" rx="40"/></clipPath>
    <path id="i-more" d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
    <path id="i-back" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
    <path id="i-refresh" d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
    <path id="i-info" d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
