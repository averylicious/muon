    <path id="i-play" d="M8 5v14l11-7z"/>
    <path id="i-pause" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
    <path id="i-next" d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
